name: Surveillance cuisinière
version: "1.1.0"
slug: surveillance_cuisiniere
url: https://github.com/Joseph7457/ha-surveillance-cuisiniere
description: Détecte si un feu est allumé grâce aux pastilles sur les boutons (caméra Tapo).
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
hassio_api: true
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:stove
panel_title: Cuisinière
options:
  camera_ip: ""
  camera_utilisateur: ""
  camera_mot_de_passe: ""
  flux: stream1
  images_par_seconde: 3
  anti_rebond_images: 5
  seuil_luminosite: 150
  contraste_min: 60
  rayon_recherche_repere: 0.06
  mouvement_seuil_pct: 0.3
  presence_maintien_secondes: 90
schema:
  camera_ip: str
  camera_utilisateur: str
  camera_mot_de_passe: password
  flux: list(stream1|stream2)
  images_par_seconde: float(0.5,10)
  anti_rebond_images: int(1,30)
  seuil_luminosite: int(50,254)
  contraste_min: int(10,200)
  rayon_recherche_repere: float(0.02,0.2)
  mouvement_seuil_pct: float(0.05,10)
  presence_maintien_secondes: int(30,600)
